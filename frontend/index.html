<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Freshness Monitoring</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Food Freshness Monitoring</h1>

        <p class="subtitle">
            Upload a food image and check its freshness instantly.
        </p>

        <input
            type="file"
            id="imageInput"
            accept="image/*"
        >

        <img
            id="preview"
            src=""
            alt="Image Preview"
        >

        <button type="button" id="predictBtn">
    Predict Freshness
</button>

        <div class="result">

            <h2>Prediction</h2>

            <p id="prediction">
                -
            </p>

            <h2>Shelf Life</h2>

            <p id="shelfLife">
                -
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
